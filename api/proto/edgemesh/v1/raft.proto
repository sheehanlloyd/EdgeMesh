syntax = "proto3";

package edgemesh.v1;

option go_package = "github.com/sheehanlloyd/edgemesh/api/gen/edgemesh/v1;edgemeshv1";

// LogEntry is a single replicated Raft log record.
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  // Placeholder entry appended by a new leader to commit entries from prior
  // terms safely. Carries no state-machine command.
  ENTRY_TYPE_NOOP = 1;
  // Serialized statemachine.Command.
  ENTRY_TYPE_COMMAND = 2;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Set when the candidate is probing before incrementing its term (PreVote).
  bool pre_vote = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
  string voter_id = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  string follower_id = 3;
  // Fast-backup hints (Raft paper section 5.3 optimization). When success is
  // false the follower reports the first index of the conflicting term, or the
  // length of its log when it is simply too short.
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
  // Highest log index known to be replicated on the follower after this call.
  uint64 last_log_index = 6;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  string follower_id = 2;
  uint64 bytes_stored = 3;
}

// RaftTransport carries the consensus RPCs between control-plane nodes.
service RaftTransport {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
  // ForwardCommand lets a follower relay an admin write to the leader.
  rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);
}

message ForwardCommandRequest {
  bytes command = 1;
}

message ForwardCommandResponse {
  uint64 config_version = 1;
  uint64 raft_index = 2;
  bytes result = 3;
}
