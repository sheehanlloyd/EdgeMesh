name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3

      # Private repos without GitHub Advanced Security cannot upload SARIF.
      # Run the analysis anyway so the check is real; skip the upload that 403s.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
