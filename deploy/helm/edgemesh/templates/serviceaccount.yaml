{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "edgemesh.serviceAccountName" . }}
  labels:
    {{- include "edgemesh.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# EdgeMesh does not talk to the Kubernetes API, so its pods have no reason to
# carry a mountable API token.
automountServiceAccountToken: false
{{- end }}
