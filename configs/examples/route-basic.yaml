# A minimal caching route.
#
# Apply with:
#   edgemeshctl routes apply -f configs/examples/route-basic.yaml
id: demo-route
hostname: demo.edgemesh.local
# The longest matching prefix wins, and matching respects slash boundaries:
# "/api" matches "/api" and "/api/v1" but never "/apix".
path_prefix: /
origin_pool_id: demo-pool
enabled: true

cache_policy:
  enabled: true
  # Used when the origin sends no s-maxage, max-age, or Expires.
  default_ttl_seconds: 60
  # Caps whatever the origin asks for.
  max_ttl_seconds: 3600

retry_policy:
  enabled: true
  # Applies only to idempotent methods. Two retries after the initial attempt.
  max_retries: 2
  backoff_base_ms: 20
  backoff_max_ms: 200

header_policy:
  # Emits X-EdgeMesh-Cache and friends. These disclose internal topology, so
  # they are off by default and useful during a demo.
  diagnostic_headers: true
